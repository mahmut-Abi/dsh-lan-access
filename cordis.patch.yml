# dsh-lan-access bundle patch
#
# This file is the `dsh.bundle.patch` layer of the package: when installed
# through the official CLI —
#
#   dsh plugin --profile web add link:/path/to/dsh-intranet-access-plugin
#
# — the command appends `dsh-lan-access` to `dsh.profile.bundles` and the
# profile boot merges THIS patch (an insert of the host row plus a webserver
# config override) like any manual cordis.patch.yml mount line.

# The host row. Docker deployments may pass DSH_PUBLIC_HOST and
# DSH_TRUSTED_HOSTS so bridge/port-mapped containers can trust the external
# authority that browsers actually use.
- insert:
    - id: lan-access
      name: 'dsh-lan-access'
      config:
        trustedHosts: !!js >-
          (process.env.DSH_TRUSTED_HOSTS ?? '').split(/[\s,]+/u).filter(Boolean)
        publicHost: !!js >-
          process.env.DSH_PUBLIC_HOST || process.env.LAN_IP || ''

# The webserver bind host follows the plugin's persisted setting. The row
# waits for the `lanAccess` service before the first bind, so enabled profiles
# do not start on loopback and then restart to all interfaces. The port keeps
# its original expression. Both keys are restated because a patch row replaces
# the target row's whole config. Drop this row to pin the bind in a later patch
# layer.
- id: webserver
  inject:
    - webStartup
    - lanAccess
  config:
    host: !!js ctx.get('lanAccess')?.host ?? '127.0.0.1'
    port: !!js ctx.webStartup.port ?? 3080
